name: Diagnóstico de acesso ao INPI

# Também os eproc da JFRJ e do TRF2. O INPI às vezes deixa de responder a faixas de datacenter. Antes de disparar
# shards, confirmar que o runner alcança o pePI (5 runners = 5 IPs).

on: workflow_dispatch

permissions:
  contents: read

jobs:
  curl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    steps:
      - run: |
          echo "IP: $(curl -s -m 10 https://api.ipify.org)"
          for u in https://busca.inpi.gov.br/pePI/ https://www.gov.br/inpi/ https://revistas.inpi.gov.br/rpi/ https://dadosabertos.inpi.gov.br/ https://eproc-consulta.jfrj.jus.br/eproc/externo_controlador.php?acao=processo_consulta_publica https://eproc-consulta.trf2.jus.br/eproc/externo_controlador.php?acao=processo_consulta_publica; do
            curl -sL -o /tmp/p.html -m 20 -w "%{http_code} %{time_total}s $u" "$u" && echo " turnstile=$(grep -c cf-turnstile /tmp/p.html)" || echo "FALHA $u"
          done
