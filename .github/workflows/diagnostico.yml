name: Diagnóstico de acesso ao INPI

# O INPI às vezes deixa de responder a faixas de datacenter. Antes de disparar
# shards, confirmar que o runner alcança o pePI (5 runners = 5 IPs).

on: workflow_dispatch

permissions:
  contents: read

jobs:
  curl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    steps:
      - run: |
          echo "IP: $(curl -s -m 10 https://api.ipify.org)"
          for u in https://busca.inpi.gov.br/pePI/ https://www.gov.br/inpi/ https://revistas.inpi.gov.br/rpi/ https://dadosabertos.inpi.gov.br/; do
            curl -s -o /dev/null -m 20 -w "%{http_code} %{time_total}s $u\n" "$u" || echo "FALHA $u"
          done
